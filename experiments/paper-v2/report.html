<style>
/* layout: one reading column; verdicts first, then evidence from aggregate down to single runs */
:root {
  --page: #f5f6f8;
  --surface: #fdfdfd;
  --ink: #14171c;
  --ink-2: #4a5160;
  --muted: #767d8b;
  --rule: #dde0e6;
  --accent: #2f4fb3;
  --seq: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --context: #b4b9c3;
  --warn: #fab219;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --step--1: 0.8125rem; --step-0: 0.9375rem; --step-1: 1.125rem;
  --step-2: 1.5rem; --step-3: 2.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1114; --surface: #171a1f; --ink: #f1f3f6; --ink-2: #b9bfca;
    --muted: #8a909c; --rule: #2a2f37; --accent: #9fb2f2; --seq: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --context: #4a505b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1114; --surface: #171a1f; --ink: #f1f3f6; --ink-2: #b9bfca;
  --muted: #8a909c; --rule: #2a2f37; --accent: #9fb2f2; --seq: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --context: #4a505b;
}
body {
  background: var(--page); color: var(--ink);
  font: var(--step-0)/1.55 var(--font-body);
  padding-inline: 20px; padding-block: 0 64px;
}
main { max-width: 1120px; margin: 0 auto; display: grid; gap: 56px; }
h1, h2 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); line-height: 1.15; }
h2 { font-size: var(--step-2); line-height: 1.2; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
a:focus-visible, select:focus-visible, svg:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
code, .mono { font-family: var(--font-data); font-size: 0.92em; }
.eyebrow {
  font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}
.howto { color: var(--ink-2); font-size: var(--step--1); }
section { display: grid; gap: 16px; }
.head { display: grid; gap: 6px; }

header { display: grid; gap: 20px; padding-block: 40px 8px; border-bottom: 1px solid var(--rule); padding-bottom: 28px; }
.question { font-size: var(--step-1); color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 12px 32px; margin: 0; }
.facts div { display: grid; gap: 2px; }
.facts dt { font-size: var(--step--1); color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }
.banner {
  display: flex; gap: 10px; align-items: baseline; padding: 10px 14px;
  border: 1px solid var(--rule); border-left: 4px solid var(--warn);
  background: var(--surface); border-radius: 4px; max-width: max-content;
}
.banner strong { white-space: nowrap; }

.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: var(--step--1); font-weight: 500; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
.sub { display: block; color: var(--muted); font-size: var(--step--1); }
.cond { font-family: var(--font-data); font-size: var(--step--1); }
th .cond { color: var(--ink-2); white-space: normal; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 2px 10px; border-radius: 999px; font-size: var(--step--1); font-weight: 500;
  border: 1px solid var(--ink-2);
}
.pill.win { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pill.none { color: var(--ink-2); }
.pill.untestable { color: var(--muted); border-style: dashed; border-color: var(--muted); }

.heat td.cell { min-width: 9ch; }
.heat td.best { font-weight: 600; }
.heat .env { font-family: var(--font-data); font-size: var(--step--1); white-space: nowrap; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.controls label { font-size: var(--step--1); color: var(--muted); display: flex; gap: 8px; align-items: center; }
select {
  font: inherit; font-size: var(--step-0); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 4px; padding: 4px 8px; max-width: 100%;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 10px 4px; display: grid; gap: 4px; }
figcaption { font-family: var(--font-data); font-size: var(--step--1); color: var(--ink-2); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font: 10px var(--font-body); font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--rule); stroke-width: 1; }
.cross { stroke: var(--ink-2); stroke-width: 1; }

#tip {
  position: fixed; pointer-events: none; z-index: 10; min-width: 180px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  box-shadow: 0 6px 20px rgb(0 0 0 / 0.12); padding: 8px 10px; font-size: var(--step--1);
  display: grid; gap: 3px;
}
#tip .row { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; }
#tip .row i { border-top: 2px solid; }
#tip strong { font-variant-numeric: tabular-nums; }
#tip .name { color: var(--muted); font-family: var(--font-data); overflow-wrap: anywhere; }

.rank svg text.label { fill: var(--ink-2); font-family: var(--font-data); font-size: 11px; }
details { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 500; }
details ul { margin: 10px 0 0; padding-left: 18px; columns: 2 280px; font-family: var(--font-data); font-size: var(--step--1); }
.method { display: grid; gap: 8px; color: var(--ink-2); font-size: var(--step--1); padding-left: 18px; margin: 0; max-width: 80ch; }
@media (prefers-reduced-motion: no-preference) { .grid figure { transition: opacity .2s; } }
</style>

<main>

  <section id="curves"></section>
  <section id="speed"></section>
  <section id="secondary"></section>
  <section id="health"></section>
  <section id="method"></section>
</main>

const M = DATA.meta;
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
}
function sv(tag, attrs = {}) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
function fmt(v, digits = 3) {
  if (!isNum(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 0 });
  return Number(v.toPrecision(digits)).toString();
}
function steps(v) {
  if (v >= 1e6) return `${+(v / 1e6).toFixed(2)}M`;
  if (v >= 1e3) return `${+(v / 1e3).toFixed(0)}k`;
  return `${v}`;
}
function pval(p) {
  if (!isNum(p)) return "–";
  return p < 0.001 ? "<0.001" : p.toFixed(3);
}
function condName(c) {
  const span = el("span", { class: "cond" });
  c.split(/(?<=[-_])/).forEach((part, i) => { if (i) span.append(el("wbr")); span.append(part); });
  return span;
}
function head(id, eyebrow, title, howto) {
  return el("div", { class: "head" },
    el("span", { class: "eyebrow", text: eyebrow }),
    el("h2", { id: `${id}-title`, text: title }),
    howto ? el("p", { class: "howto", text: howto }) : null);
}
function table(headers, rows, cls = "") {
  const thead = el("thead", {}, el("tr", {}, headers.map((h) =>
    el("th", { class: h.num ? "num" : "", scope: "col" }, h.node ?? h.text))));
  return el("div", { class: "scroll" }, el("table", { class: cls }, thead, el("tbody", {}, rows)));
}

function renderHeader() {
  const h = DATA.health;
  const c = h.cluster;
  const cost = c ? c.jobs.reduce((a, j) => [a[0] + j.cpu_h, a[1] + j.gpu_h], [0, 0]) : null;
  const facts = [
    ["Complete runs", `${h.complete} / ${h.expected}`],
    ["Grid", `${M.envs.length} envs × ${M.conditions.length} conditions × ${M.seeds} seeds`],
    ["Budget per run", `${steps(M.total_steps)} env steps`],
    ["Score", `${M.metric}, mean over last ${Math.round(M.final_window * 100)}%`],
    cost ? ["WCSS cost", `${fmt(cost[0])} CPU-h · ${fmt(cost[1])} GPU-h`] : null,
    ["Code", h.commits.length ? h.commits.join(", ") : "–"],
    ["Generated", M.generated.replace("T", " ")],
  ].filter(Boolean);
  const top = document.getElementById("top");
  top.append(
    el("span", { class: "eyebrow" }, "WCSS experiment · wandb tag ", el("code", { text: M.tag })),
    el("h1", { text: M.name }),
    M.question ? el("p", { class: "question", text: M.question }) : null,
    el("dl", { class: "facts" }, facts.map(([k, v]) => el("div", {}, el("dt", { text: k }), el("dd", { text: v })))),
    el("p", {}, el("a", { href: M.wandb, target: "_blank", rel: "noopener", text: "Open the wandb project" })));
  const gaps = h.missing.length + h.incomplete.length;
  if (gaps) {
    top.append(el("div", { class: "banner", role: "note" },
      el("strong", { text: `${gaps} runs missing or unfinished.` }),
      el("span", {}, "Every number below uses complete runs only. ", el("a", { href: "#health", text: "See which runs" }))));
  }
}

function renderVerdicts() {
  const sec = document.getElementById("verdicts");
  sec.append(head("verdicts", "Answers", "Planned comparisons",
    "Each row tests A against B on normalized final score, paired by environment (Wilcoxon), Holm-corrected across rows. P(A>B) is the chance a random A run beats a random B run on the same env."));
  if (!DATA.comparisons.length) { sec.append(el("p", { class: "howto", text: "No [[comparisons]] in experiment.toml." })); return; }
  const label = { "a better": "A ahead", "b better": "B ahead", "no difference": "No detectable difference", "untestable": `Too few envs (< 6)` };
  const cls = { "a better": "win", "b better": "win", "no difference": "none", "untestable": "untestable" };
  const rows = DATA.comparisons.map((c) => el("tr", {},
    el("td", {}, c.question || "–"),
    el("td", {}, el("span", { class: "sub", text: "A" }), condName(c.a), el("span", { class: "sub", text: "B" }), condName(c.b)),
    el("td", {}, el("span", { class: `pill ${cls[c.verdict]}`, text: label[c.verdict] })),
    el("td", { class: "num" }, `${c.wins} / ${c.envs}`, el("span", { class: "sub", text: `B ahead on ${c.losses}` })),
    el("td", { class: "num", text: fmt(c.p_a_gt_b, 2) }),
    el("td", { class: "num", text: isNum(c.median_diff) ? `${c.median_diff > 0 ? "+" : ""}${c.median_diff.toFixed(2)}` : "–" }),
    el("td", { class: "num" }, pval(c.p_holm), el("span", { class: "sub", text: `raw ${pval(c.p)}` }))));
  sec.append(table([{ text: "Question" }, { text: "Conditions" }, { text: "Verdict" },
    { text: "Envs A ahead", num: 1 }, { text: "P(A>B)", num: 1 }, { text: "Median Δ", num: 1 }, { text: "p (Holm)", num: 1 }], rows));
}

function renderRanking() {
  const sec = document.getElementById("ranking");
  sec.append(head("ranking", "Overall", "Normalized final score",
    "Per environment, 0 is the worst condition's mean and 1 the best. Dot = interquartile mean over all env × seed runs, bar = 95% stratified bootstrap interval. Overlapping bars mean the ranking between them is not settled."));
  const rows = DATA.aggregate.filter((r) => isNum(r.iqm)).sort((a, b) => b.iqm - a.iqm);
  if (!rows.length) { sec.append(el("p", { class: "howto", text: "No complete runs yet." })); return; }
  const W = 760, rowH = 26, L = 200, R = 70, T = 8, B = 26, H = T + rowH * rows.length + B;
  const x = (v) => L + Math.max(0, Math.min(1, v)) * (W - L - R);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-labelledby": "ranking-title" });
  [0, 0.25, 0.5, 0.75, 1].forEach((t) => {
    svg.append(sv("line", { x1: x(t), x2: x(t), y1: T, y2: H - B, class: "gridline" }));
    const tx = sv("text", { x: x(t), y: H - 8, "text-anchor": "middle" }); tx.textContent = t; svg.append(tx);
  });
  rows.forEach((r, i) => {
    const y = T + rowH * i + rowH / 2;
    const lab = sv("text", { x: L - 12, y: y + 4, "text-anchor": "end", class: "label" }); lab.textContent = r.condition;
    const val = sv("text", { x: W - R + 10, y: y + 4 }); val.textContent = `${r.iqm.toFixed(2)}  n=${r.runs}`;
    svg.append(lab, val,
      sv("line", { x1: x(r.lo), x2: x(r.hi), y1: y, y2: y, stroke: "var(--s1)", "stroke-width": 2, "stroke-linecap": "round" }),
      sv("circle", { cx: x(r.iqm), cy: y, r: 5, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2 }));
  });
  sec.append(el("div", { class: "scroll" }, svg));
}

function renderEnvTable() {
  const sec = document.getElementById("envs");
  sec.append(head("envs", "Per environment", `Final ${M.metric}`,
    `Mean ± 95% CI over seeds (n below). Shading follows the normalized score; the best mean in each row is bold.`));
  const rows = M.envs.map((env) => {
    const row = DATA.table[env];
    const best = Math.max(...M.conditions.map((c) => row[c].mean ?? -Infinity));
    return el("tr", {}, el("td", { class: "env", text: env }), M.conditions.map((c) => {
      const cell = row[c];
      const td = el("td", { class: `num cell${cell.mean === best && isNum(best) ? " best" : ""}` },
        cell.n ? `${fmt(cell.mean)}${isNum(cell.ci) ? ` ± ${fmt(cell.ci, 2)}` : ""}` : "–",
        el("span", { class: "sub", text: `n=${cell.n}` }));
      if (isNum(cell.norm)) td.style.background = `color-mix(in oklab, var(--seq) ${Math.round(cell.norm * 38)}%, transparent)`;
      return td;
    }));
  });
  sec.append(table([{ text: "Environment" }, ...M.conditions.map((c) => ({ node: condName(c), num: 1 }))], rows, "heat"));
}

function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || Math.abs(hi) || 1;
  const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const ticks = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 1e-9; t += step) ticks.push(+t.toPrecision(10));
  return ticks;
}

function seriesFor(view) {
  if (view === "all") {
    return M.conditions.map((c, i) => ({ cond: c, color: i < 8 ? `var(${SLOTS[i]})` : "var(--context)", band: i < 8, width: i < 8 ? 2 : 1.25 }));
  }
  const c = DATA.comparisons[+view];
  return [{ cond: c.a, color: "var(--s1)", band: true, width: 2, role: "A" }, { cond: c.b, color: "var(--s2)", band: true, width: 2, role: "B" }];
}

const tip = document.getElementById("tip");
function showTip(evt, env, series, idx) {
  const g = DATA.curves.grid;
  tip.replaceChildren(el("span", { class: "sub", text: `${env} · ${steps(g[idx])} steps` }));
  const vals = series.map((s) => ({ s, c: DATA.curves.envs[env][s.cond] }))
    .filter(({ c }) => c && isNum(c.mean[idx]))
    .sort((a, b) => b.c.mean[idx] - a.c.mean[idx]);
  for (const { s, c } of vals) {
    tip.append(el("div", { class: "row" }, el("i", { style: `border-color:${s.color}` }),
      el("strong", { text: `${fmt(c.mean[idx])}${isNum(c.ci[idx]) ? ` ± ${fmt(c.ci[idx], 2)}` : ""}` }),
      el("span", { class: "name", text: `${s.role ? s.role + " " : ""}${s.cond} (n=${c.n[idx]})` })));
  }
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  const left = evt.clientX + 16 + r.width > innerWidth ? evt.clientX - r.width - 16 : evt.clientX + 16;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${Math.max(8, Math.min(evt.clientY - 10, innerHeight - r.height - 8))}px`;
}

function chart(env, series, comparison) {
  const W = 340, H = 210, L = 46, R = 10, T = 10, B = 24;
  const grid = DATA.curves.grid, data = DATA.curves.envs[env] ?? {};
  const vals = series.flatMap((s) => {
    const c = data[s.cond]; if (!c) return [];
    return c.mean.flatMap((m, i) => isNum(m) ? [m - (c.ci[i] ?? 0), m + (c.ci[i] ?? 0)] : []);
  });
  const pe = comparison?.per_env[env];
  const fig = el("figure", {}, el("figcaption", {}, env,
    pe ? el("span", { class: "sub", text: `${pe.a > pe.b ? "A" : "B"} ahead · P(A>B) ${fmt(pe.p_a_gt_b, 2)} · Mann–Whitney p ${pval(pe.p_mwu)}` }) : null));
  if (!vals.length) { fig.append(el("p", { class: "howto", text: "No data yet." })); return fig; }
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = (v) => L + (v / M.total_steps) * (W - L - R);
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: "img", "aria-label": `${M.metric} over env steps on ${env}` });
  for (const t of ticks) {
    svg.append(sv("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: "gridline" }));
    const tx = sv("text", { x: L - 6, y: Y(t) + 3, "text-anchor": "end" }); tx.textContent = fmt(t); svg.append(tx);
  }
  for (const f of [0, 0.25, 0.5, 0.75, 1]) {
    const tx = sv("text", { x: X(f * M.total_steps), y: H - 6, "text-anchor": f === 0 ? "start" : f === 1 ? "end" : "middle" });
    tx.textContent = steps(f * M.total_steps); svg.append(tx);
  }
  const ordered = [...series].reverse();
  for (const s of ordered) {
    const c = data[s.cond]; if (!c) continue;
    const idx = grid.map((_, i) => i).filter((i) => isNum(c.mean[i]));
    if (s.band) {
      const withCi = idx.filter((i) => isNum(c.ci[i]));
      if (withCi.length > 1) {
        const up = withCi.map((i) => `${X(grid[i])},${Y(c.mean[i] + c.ci[i])}`);
        const dn = withCi.slice().reverse().map((i) => `${X(grid[i])},${Y(c.mean[i] - c.ci[i])}`);
        svg.append(sv("polygon", { points: [...up, ...dn].join(" "), fill: s.color, "fill-opacity": 0.14, stroke: "none" }));
      }
    }
    svg.append(sv("polyline", { points: idx.map((i) => `${X(grid[i])},${Y(c.mean[i])}`).join(" "), fill: "none", stroke: s.color, "stroke-width": s.width, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  }
  const cross = sv("line", { y1: T, y2: H - B, class: "cross", visibility: "hidden" });
  const hit = sv("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
  svg.append(cross, hit);
  let cur = grid.length - 1;
  const show = (evt, i) => {
    cur = Math.max(0, Math.min(grid.length - 1, i));
    cross.setAttribute("x1", X(grid[cur])); cross.setAttribute("x2", X(grid[cur]));
    cross.setAttribute("visibility", "visible");
    showTip(evt, env, series, cur);
  };
  const hide = () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; };
  hit.addEventListener("pointermove", (evt) => {
    const box = svg.getBoundingClientRect();
    const vx = ((evt.clientX - box.left) / box.width) * W;
    const frac = (vx - L) / (W - L - R);
    show(evt, Math.round(frac * grid.length - 1));
  });
  hit.addEventListener("pointerleave", hide);
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (evt) => {
    if (evt.key !== "ArrowLeft" && evt.key !== "ArrowRight") return;
    evt.preventDefault();
    const box = svg.getBoundingClientRect();
    const i = cur + (evt.key === "ArrowRight" ? 1 : -1);
    show({ clientX: box.left + (X(grid[Math.max(0, Math.min(grid.length - 1, i))]) / W) * box.width, clientY: box.top + box.height / 3 }, i);
  });
  fig.append(svg);
  return fig;
}

function renderCurves() {
  const sec = document.getElementById("curves");
  sec.append(head("curves", "Over training", "Learning curves",
    `Mean ${M.metric} over seeds against env steps, shaded 95% CI. Hover or focus a chart and use the arrow keys to read values.`));
  const select = el("select", { id: "curve-view" });
  DATA.comparisons.forEach((c, i) => select.append(el("option", { value: i, text: `${c.a}  vs  ${c.b}` })));
  select.append(el("option", { value: "all", text: "All conditions" }));
  const legend = el("div", { class: "legend", "aria-label": "Legend" });
  const grid = el("div", { class: "grid" });
  const note = el("p", { class: "howto" });
  const draw = () => {
    const series = seriesFor(select.value);
    legend.replaceChildren(...series.map((s) => el("span", {}, el("i", { style: `border-color:${s.color}` }),
      s.role ? el("strong", { text: s.role }) : null, el("span", { class: "cond", text: s.cond }))));
    note.textContent = select.value === "all" && M.conditions.length > 8
      ? "Conditions after the eighth are drawn as thin grey context lines; reorder `conditions` in experiment.toml to choose which get colour."
      : "";
    const comparison = select.value === "all" ? null : DATA.comparisons[+select.value];
    grid.replaceChildren(...M.envs.map((env) => chart(env, series, comparison)));
  };
  select.addEventListener("change", draw);
  sec.append(el("div", { class: "controls" }, el("label", { for: "curve-view" }, "Show", select)), legend, note, grid);
  draw();
}

function renderSpeed() {
  const sec = document.getElementById("speed");
  const s = DATA.speedup;
  sec.append(head("speed", "Sample efficiency", `Speed to threshold vs ${M.reference}`,
    `A threshold of f is the starting return plus f of ${M.reference}'s improvement on that env. Cell = median over envs of (${M.reference} steps ÷ condition steps); above 1× is faster. "k/N" counts the envs where both reached it with most seeds.`));
  const rows = M.conditions.map((c) => el("tr", {}, el("td", {}, condName(c)),
    s.rows[c].map((r) => el("td", { class: "num" }, isNum(r.median) ? `${r.median.toFixed(2)}×` : "–",
      el("span", { class: "sub", text: `${r.envs}/${s.eligible.length}` })))));
  sec.append(table([{ text: "Condition" }, ...M.thresholds.map((t) => ({ text: `${Math.round(t * 100)}%`, num: 1 }))], rows));
  if (s.skipped.length) sec.append(el("p", { class: "howto", text: `Left out because ${M.reference} did not improve on its start or has no complete runs: ${s.skipped.join(", ")}.` }));
}

function renderSecondary() {
  const sec = document.getElementById("secondary");
  if (!DATA.secondary.length) { sec.remove(); return; }
  sec.append(head("secondary", "Mechanism", "Secondary metrics",
    `Mean over complete runs of the last ${Math.round(M.final_window * 100)}% of training, ± 95% CI, pooled across envs. Blank where a condition does not log the metric.`));
  const headers = [{ text: "Condition" }, ...DATA.secondary.map((m) => ({
    node: el("span", {}, m.label, m.note ? el("span", { class: "sub", text: m.note }) : null), num: 1 }))];
  const rows = M.conditions.map((c) => el("tr", {}, el("td", {}, condName(c)), DATA.secondary.map((m) => {
    const v = m.by_condition[c];
    return el("td", { class: "num" }, v.n ? `${fmt(v.mean)}${isNum(v.ci) ? ` ± ${fmt(v.ci, 2)}` : ""}` : "–",
      v.n ? el("span", { class: "sub", text: `n=${v.n}` }) : null);
  })));
  sec.append(table(headers, rows));
}

function listBlock(title, items, render) {
  if (!items?.length) return null;
  return el("details", {}, el("summary", { text: `${title} (${items.length})` }), el("ul", {}, items.map((it) => el("li", {}, render(it)))));
}

function renderHealth() {
  const sec = document.getElementById("health");
  const h = DATA.health, idx = h.index ?? {};
  sec.append(head("health", "Coverage", "Runs and cluster state",
    `${h.complete} of ${h.expected} expected runs finished their full budget. Wandb data fetched ${idx.fetched?.replace("T", " ") ?? "–"}.`));
  const blocks = [
    listBlock("Not in wandb", h.missing, (m) => m),
    listBlock("Unfinished", h.incomplete, (r) => el("span", {},
      el("a", { href: r.url, target: "_blank", rel: "noopener", text: r.name }), ` ${r.state}, ${Math.round(r.progress * 100)}%`)),
    listBlock("Duplicates ignored", idx.duplicates, (m) => m),
    listBlock("Names not matching wandb.run_name", idx.unparsed, (m) => m),
    listBlock("Tagged runs outside the grid", idx.off_grid, (m) => m),
  ].filter(Boolean);
  if (h.cluster) {
    const rows = h.cluster.jobs.map((j) => el("tr", {},
      el("td", { class: "mono", text: j.id }), el("td", { text: j.label || "–" }),
      el("td", { text: Object.entries(j.states).map(([k, v]) => `${k} ${v}`).join(" · ") || "–" }),
      el("td", { class: "num", text: fmt(j.cpu_h) }), el("td", { class: "num", text: fmt(j.gpu_h) }),
      el("td", { class: "num", text: j.failed.length })));
    sec.append(el("p", { class: "howto", text: `SLURM accounting checked ${h.cluster.checked.replace("T", " ")}.` }),
      table([{ text: "Array job" }, { text: "Label" }, { text: "Task states" }, { text: "CPU-h", num: 1 }, { text: "GPU-h", num: 1 }, { text: "Failed", num: 1 }], rows));
  }
  if (blocks.length) sec.append(...blocks);
  else sec.append(el("p", { text: "Every expected run is present and complete." }));
}

function renderMethod() {
  const sec = document.getElementById("method");
  sec.append(head("method", "Method", "How the numbers are made"));
  const items = [
    `Final score of a run: mean of ${M.metric} (${M.metric_keys.join(" or ")}) over the last ${Math.round(M.final_window * 100)}% of the ${steps(M.total_steps)}-step budget. Runs that stopped before 99% of the budget are excluded.`,
    "Normalization per environment: (score − worst condition mean) ÷ (best − worst). Makes environments with different return scales comparable; depends on which conditions are in the grid.",
    "Aggregate: interquartile mean of normalized run scores, 95% interval from 2000 bootstrap resamples of seeds within each environment.",
    "Comparisons: two-sided Wilcoxon signed-rank test on per-environment differences of normalized means, Holm correction across the planned comparisons, α = 0.05. With fewer than 6 environments the test cannot reach significance and is not run. Per-environment Mann–Whitney p-values over seeds appear above each learning curve in a comparison view; they are uncorrected and do not feed the verdicts.",
    `Steps to threshold: first env step where a 3-eval moving average of the curve reaches the threshold; a condition reaches it on an env when most of its seeds do.`,
  ];
  sec.append(el("ul", { class: "method" }, items.map((t) => el("li", { text: t }))));
}

renderHeader();
renderVerdicts();
renderRanking();
renderEnvTable();
renderCurves();
renderSpeed();
renderSecondary();
renderHealth();
renderMethod();
</script>
