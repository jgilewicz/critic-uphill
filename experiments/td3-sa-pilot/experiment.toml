# Preregistration, fixed 2026-11-16 before any chain was run. Do not edit
# question, [chain], [compare] or [rule] after the first chain rollout.
name = "td3-sa-pilot"
question = """In plateau phases, does a simulated-annealing chain over the
TD3 actor, run from a checkpoint for 100k env steps, gain more return than
the same TD3 run gained over its next 100k steps?"""
protocol = 3
seeds = [0, 1]
# checkpoints, sigma levels (cell["sigmas"]) and the td3 eval_rl curves
# (its cache/full) come from here
source = "../critic-degeneracy-v1/experiment.toml"
# per-episode data of the same checkpoints, for T0
episodes_source = "../local-search-v1/experiment.toml"

# cell = env x seed x checkpoint step. HalfCheetah 600k = no-harm control
[[cells]]
env = "Swimmer-v5"
steps = [300_000, 600_000, 1_000_000]

[[cells]]
env = "Walker2d-v5"
steps = [600_000]

[[cells]]
env = "HalfCheetah-v5"
steps = [600_000]

# chains: python -m offline.sa_chain run <toml> <ckpt_root> <env> (from src/)
[chain]
budget = 100_000
snapshots = [25_000, 50_000, 100_000]
# k reset seeds per iteration, fresh each iteration, shared by the current
# policy and the candidate (paired). cost = actual steps of the 2k episodes
k = 3
# proposal theta' = theta + sigma * std(W) * N(0, 1) per leaf of the current
# head (as CEM / critic-degeneracy-v1), sigma = the cell's calibrated level
sigma_levels = [0, 1]
# delta = mean over the k seeds of R(theta') - R(theta). accept if delta > 0,
# else with probability exp(delta / T). "anneal": T = T0 * (1 - used /
# budget), "greedy": T = 0 (accept iff delta > 0)
schedules = ["anneal", "greedy"]
# T0 per cell and sigma level = median over the 40 perturbations of
# sd(paired difference over the 30 episodes) / sqrt(k), from the
# local-search-v1 episodes (noise of delta at the chain's k)
chains = 5
# reset seeds of chain c, iteration i, episode j: seed_base + c * stride +
# k * i + j (the same stream for every variant: common random numbers)
seed_base = 3_000_000
seed_stride = 100_000
key = 20261118
# an iteration starts only while used < budget (overshoot < 1 iteration)

# final evaluation, outside the budget: start actor + every snapshot of every
# chain (1 + 4 variants x 5 chains x 3 = 61 heads) in one batch, on the same
# fresh reset seeds (paired)
[evaluation]
episodes = 10
seed_base = 4_000_000

# variant = sigma level x schedule (4). SA gain(cell, variant, snapshot) =
# mean over the 5 chains of mean over the 10 episodes of R(snapshot) -
# R(start actor). TD3 gain(cell) = mean perf/eval_rl in [t + 100k - w,
# t + 100k + w] - mean in [t - w, t + w] (5 eval points x 5 episodes each),
# same run. 1M: no TD3 curve beyond, SA gain vs the start actor only
[compare]
window = 10_000

[rule]
sa_beats_td3 = """some variant, at the 100k snapshot, has SA gain > 0 and
> TD3 gain in >= 3 of the 4 Swimmer pairs (300k, 600k x seeds 0, 1), and in
Walker2d 600k on the stuck seed, and has |SA gain| < 2% of the start
actor's return on both HalfCheetah 600k seeds"""
# the seed whose actor falls after ~297 steps (return 944 vs 5060), from
# local-search-v1. Walker2d 600k seed 1, Swimmer 1M: reported, not in the rule
stuck_seed = 0
hc_max_rel = 0.02

[analysis]
chains_cache = "cache/chains"

[report]
url = "https://claude.ai/code/artifact/d014ff24-b872-465d-a175-37cb78b31b00"
