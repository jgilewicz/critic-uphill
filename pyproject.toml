[project]
name = "critic-uphill"
version = "0.1.0"
description = "Why critic surrogates in evolutionary RL fail to beat plain TD3 under a fair step budget"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.1",
    "jax[cuda12]>=0.11.1; sys_platform == 'linux'",
    "optax>=0.2.8",
    "wandb>=0.29.0",
    "gymnasium[mujoco]==1.2.3",
    "mujoco==3.6.0",
    "hydra-core>=1.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents",
    "src/algos",
    "src/analysis",
    "src/common",
    "src/environments",
    "src/fitness",
    "src/modules",
]

[tool.ruff]
line-length = 80

[tool.ty.rules]
