defaults:
  - algorithm: evorainbow
  - _self_

protocol: 5
seed: 0
total_steps: 1_000_000

env:
  id: HalfCheetah-v5
eval_env:
  id: HalfCheetah-v5

eval:
  episodes: 10
  interval: 5000

# Critic degeneration measurement (no env steps)
deg:
  interval: 50_000
  n_states: 2000
  n_perturbations: 40
  sigmas: [0.05, 0.2]

# Truth probe: paired real episodes on the eval env, outside the budget
probe:
  enabled: true
  interval: 100_000
  n_perturbations: 8
  episodes: 3

# Offline-analysis checkpoints (td3 agents), off while dir is null
checkpoint:
  dir: null
  fractions: [0.1, 0.5, 1.0]
  buffer_tail: 200_000
  generations: 4

wandb:
  enabled: true
  project: critic_uphill
  entity: w1ndrunn3rr-wroc-aw-univeristy-of-science-and-technology
  name: null
  tags: []

hydra:
  run:
    dir: outputs/${algorithm.name}_${env.id}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
