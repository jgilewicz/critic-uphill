# @package algorithm
# Networks and init match official EvoRainbow (MUJOCO/EvoRainbow_Algs.py):
# - SharedStateEmbedding: Linear(obs,400)->LN->tanh->Linear(400,300)->LN->tanh
# - ActorHead: Linear(300,act)->tanh * action_limit. RL actor weight and bias
#   scaled by 0.1, CEM mu_init uses unscaled default Linear init (pop[0]).
# - Twin Critic: [obs+act->400->LN->leaky_relu->300->LN->leaky_relu->1],
#   output layer weight and bias scaled by 0.1
# - Separate embedding optimizer (lr 1e-3) and grad-norm clip 10 on all nets
# - In agent=sac mode, rl defaults come from algorithm/sac.yaml (unless
#   overridden on CLI). Because evorainbow.yaml defines TD3's rl schema,
#   overriding SAC-only rl keys under EvoRainbow requires Hydra's + prefix
#   (e.g. +algorithm.rl.alpha_lr=1e-4). CEM evolves GaussianActorHead via its
#   deterministic path, genetic soft update targets the online actor only,
#   and surrogates query online Q1.
# - Per-env overrides (cem.damp, rl_to_ea.period, ea_to_rl.tau, eval.p_real)
#   live in algorithm/env/<env.id>.yaml, applied automatically from env.id
#   and individually overridable from the CLI.

name: evorainbow
agent: td3  # RL agent backend: td3 | sac

horizon: 1000
embedding_dim: 300
pop_size: 5

cem:
  sigma_init: 1e-3
  damp: 1e-3
  damp_limit: 1e-5
  elitism: false

rl:
  critic_hidden_dims: [400, 300]
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  exploration_noise: 0.1
  actor_lr: 1e-3
  critic_lr: 1e-3
  batch_size: 128
  buffer_capacity: 1_000_000
  warmup_steps: 10_000
  train_ratio: 1.0

rl_to_ea:
  period: 1

ea_to_rl:
  tau: 0.3

# Population fitness estimator: full | critic | hboot | prefix.
# prefix scores the undiscounted return of the first h real steps.
# Critic surrogate (critic and hboot bootstrap) uses online critic Q1.
# In critic/hboot modes, each individual independently gets a full episode
# with probability eval.p_real, else the surrogate.
eval:
  mode: hboot
  h: 200
  critic_states: 50_000
  p_real: 0.5

# Shadow twin critic (agent=td3): own init and targets, TD-trained on the
# critic's batches against the min of its own target heads at the target
# actor, never in the actor loss. surrogate=true scores eval.mode=critic
# with the shadow's first head instead of Q1.
shadow:
  enabled: false
  surrogate: false

# Matched run (both > 0): stop after `generations` generations (warmup
# included) with exactly `rl_updates` RL updates spread over the
# post-warmup generations. 0/0 runs to the step budget.
matched:
  generations: 0
  rl_updates: 0
