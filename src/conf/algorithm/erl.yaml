# @package algorithm
# ERL: TD3 + CEM population on a shared Z(s). Defaults = paper-v2 erl.
name: erl

horizon: 1000
async_env: true
embedding_dim: 256

pop_size: 10
# head: CEM over ActorHead on the TD3 embedding | policy: embedding + head
evo_target: head
cem:
  sigma_init: 1e-3
  damp: 1e-3
  damp_limit: 1e-5
  elitism: true
  # none | rl_actor (CEM mean reset to the RL actor before every ask)
  mean_anchor: none

# false: pure CEM, no TD3 rollout, training or buffer
rl:
  enabled: true
  critic_hidden_dims: [400, 300]
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  exploration_noise: 0.1
  actor_lr: 1e-3
  critic_lr: 1e-3
  batch_size: 256
  buffer_capacity: 1_000_000
  warmup_steps: 10_000
  train_ratio: 1.0

# RL actor injected into the weakest individual every `period` gens, 0 = never
rl_to_ea:
  period: 5
# champion -> RL actor: off | soft | soft_if_better (champion beats the RL
# actor under the same fitness estimator)
ea_to_rl:
  mode: soft
  tau: 0.005

# population fitness: full | prefix (first prefix_h steps) |
#   critic (real rollout with p_real, else calibrated Q) | rl_only (no population)
eval:
  mode: full
  prefix_h: 200
  p_real: 0.21
  surrogate_batch: 1024
