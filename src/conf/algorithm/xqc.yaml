# @package algorithm
# XQC (Palenicek et al., https://github.com/danielpalenicek/xqc, commit
# 9a6832b) with the original agent defaults:
# - Actor: BatchNorm embedder + 4 x [Dense(256, no bias) -> BN -> ReLU],
#   tanh-Gaussian head (mean, log_std clipped to [-10, 2])
# - Critic: 2 independent members, BatchNorm embedder + 4 x [Dense(512) ->
#   BN -> ReLU], 101-bin categorical value on [-5, 5]
# - Weight-norm projection of every Dense kernel after each update
# - Policy delay 3, UTD 2, target tau 0.005, lr 3e-4 -> 3e-5 (linear over
#   total_steps * updates_per_step), the temperature uses actor_lr
# - horizon sets the discount: clip((T/5 - 1) / (T/5), 0.95, 0.995)
name: xqc

horizon: 1000
actor_hidden_dims: [256, 256, 256, 256]
critic_hidden_dims: [512, 512, 512, 512]
actor_lr: 3e-4
critic_lr: 3e-4
lr_end: 3e-5
policy_delay: 3
tau: 0.005
init_temperature: 0.01
min_v: -5.0
max_v: 5.0
num_bins: 101
updates_per_step: 2
batch_size: 256
start_training: 5000
buffer_capacity: 1_000_000
