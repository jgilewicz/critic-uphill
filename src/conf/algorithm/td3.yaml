# @package algorithm
# Networks match official EvoRainbow MUJOCO/EvoRainbow_core/EvoRainbow_Algs.py:
# - SharedStateEmbedding: Linear(obs,400)->LN->tanh->Linear(400,300)->LN->tanh
# - ActorHead: Linear(300,act)->tanh * action_limit (RL init scaled by 0.1)
# - Twin Critic: [obs+act->400->LN->leaky_relu->300->LN->leaky_relu->1],
#   output layer weight and bias scaled by 0.1
# - Separate embedding optimizer (lr 1e-3) and grad-norm clip 10 on all nets
name: td3

horizon: 1000
embedding_dim: 300

rl:
  critic_hidden_dims: [400, 300]
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  exploration_noise: 0.1
  actor_lr: 1e-3
  critic_lr: 1e-3
  batch_size: 128
  buffer_capacity: 1_000_000
  warmup_steps: 10_000
  train_ratio: 1.0

# Full network resets (standalone td3 only, enabled by algorithm=td3-reset)
reset:
  enabled: false
  at_steps: [200_000, 400_000, 600_000]

# Shadow twin critic as a metric (td3 only): own init and targets,
# TD-trained on the critic's batches, never in the actor loss
shadow:
  enabled: false
