# @package algorithm
name: td3

horizon: 1000
embedding_dim: 256

rl:
  critic_hidden_dims: [400, 300]
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  exploration_noise: 0.1
  actor_lr: 1e-3
  critic_lr: 1e-3
  batch_size: 256
  buffer_capacity: 1_000_000
  warmup_steps: 10_000
  train_ratio: 1.0
